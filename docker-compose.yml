version: "3.9"

services:
  web:
    build: .
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    environment:
      FLASK_PORT: "${FLASK_PORT:-5000}"
      FLASK_DEBUG: "${FLASK_DEBUG:-False}"
      STORAGE_PATH: /app/data
      DATABASE_URL: "sqlite:////app/data/residual.db"
      SESSION_TIMEOUT: "${SESSION_TIMEOUT:-3600}"
      MAX_SESSIONS: "${MAX_SESSIONS:-100}"
      ENABLE_PERSISTENCE: "${ENABLE_PERSISTENCE:-True}"
      RATE_LIMIT: "${RATE_LIMIT:-10}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
