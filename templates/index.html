<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResidualChat-Resonant</title>
<style>
  /* ── Quantum Singularity Theme ── */
  :root {
    --bg:        #0a0e27;
    --surface:   #0d1433;
    --border:    #1a2255;
    --cyan:      #00d9ff;
    --blue:      #0080ff;
    --purple:    #b300ff;
    --text:      #c8d8f0;
    --text-dim:  #6a7fa8;
    --user-bg:   #0d1a3a;
    --ai-bg:     #0e1530;
    --glow-c:    rgba(0,217,255,.35);
    --glow-p:    rgba(179,0,255,.35);
    --error:     #ff4466;
    --success:   #00ff99;
    --mono:      'Fira Code', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated star field */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(0,217,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 70%, rgba(179,0,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(0,128,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(0,217,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 55%, rgba(179,0,255,.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative;
    z-index: 10;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,14,39,.8);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .08em;
    background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { filter: brightness(1); }
    50%       { filter: brightness(1.35); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── Status bar ── */
  #status-bar {
    font-size: .7rem;
    color: var(--text-dim);
    letter-spacing: .05em;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .status-pill {
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: rgba(0,217,255,.05);
    color: var(--cyan);
    transition: box-shadow .3s;
  }

  .status-pill.pulse {
    box-shadow: 0 0 10px var(--glow-c);
  }

  /* ── Keyboard hint ── */
  .key-hint {
    font-size: .65rem;
    color: var(--text-dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  kbd {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.05);
    font-family: var(--mono);
    font-size: .65rem;
    color: var(--cyan);
  }

  /* ── Main layout ── */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 57px);
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: rgba(13,20,51,.85);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    gap: 8px;
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  #sessions-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    overflow-y: auto;
  }

  .session-item {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: rgba(255,255,255,.03);
    cursor: pointer;
    font-size: .7rem;
    color: var(--text-dim);
    transition: all .2s;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .session-item:hover, .session-item.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,217,255,.07);
    box-shadow: 0 0 8px var(--glow-c);
  }

  .sidebar-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ── Chat area ── */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar       { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: .85rem;
    line-height: 1.6;
    position: relative;
    animation: fadeIn .3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--user-bg);
    border: 1px solid #1a2a5a;
    box-shadow: 0 0 16px rgba(0,128,255,.15);
    color: #a8c8ff;
  }

  .bubble.assistant {
    align-self: flex-start;
    background: var(--ai-bg);
    border: 1px solid #1a2060;
    box-shadow: 0 0 16px rgba(0,217,255,.1);
    color: var(--text);
  }

  .bubble.assistant::before {
    content: '◈';
    position: absolute;
    top: 12px;
    left: -20px;
    color: var(--cyan);
    font-size: .75rem;
    opacity: .7;
  }

  .bubble-actions {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* ── Typing indicator ── */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    animation: bounce 1.2s infinite ease;
  }

  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .5; }
    40%            { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Input area ── */
  #input-area {
    padding: 16px 24px;
    background: rgba(10,14,39,.9);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    background: rgba(13,20,51,.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: .85rem;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }

  #user-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px var(--glow-c);
  }

  #user-input::placeholder { color: var(--text-dim); }

  /* ── Buttons ── */
  .btn {
    padding: 8px 16px;
    border-radius: 7px;
    border: 1px solid;
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .04em;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-color: var(--cyan);
    color: var(--bg);
    box-shadow: 0 0 14px var(--glow-c);
  }

  .btn-primary:hover {
    box-shadow: 0 0 24px var(--glow-c);
    transform: translateY(-1px);
  }

  .btn-confirm {
    background: rgba(0,255,153,.1);
    border-color: #00ff99;
    color: var(--success);
  }

  .btn-confirm:hover { box-shadow: 0 0 12px rgba(0,255,153,.4); }

  .btn-reject {
    background: rgba(255,68,102,.1);
    border-color: var(--error);
    color: var(--error);
  }

  .btn-reject:hover { box-shadow: 0 0 12px rgba(255,68,102,.4); }

  .btn-ghost {
    background: rgba(255,255,255,.04);
    border-color: var(--border);
    color: var(--text-dim);
  }

  .btn-ghost:hover {
    border-color: var(--purple);
    color: var(--purple);
    box-shadow: 0 0 10px var(--glow-p);
  }

  .btn-sm {
    padding: 4px 10px;
    font-size: .72rem;
  }

  /* ── Action bar below input ── */
  .action-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: .78rem;
    color: #fff;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    transform: translateY(10px);
  }

  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  #toast.success { background: rgba(0,255,153,.85); color: #000; border: 1px solid var(--success); }
  #toast.error   { background: rgba(255,68,102,.85); border: 1px solid var(--error); }
  #toast.info    { background: rgba(0,128,255,.85); border: 1px solid var(--blue); }

  /* ── Command palette ── */
  #cmd-palette {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 500;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
  }

  #cmd-palette.open { display: flex; }

  .palette-box {
    width: 500px;
    max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--cyan);
    border-radius: 12px;
    box-shadow: 0 0 40px var(--glow-c);
    overflow: hidden;
  }

  .palette-search {
    width: 100%;
    padding: 14px 18px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: .9rem;
    outline: none;
  }

  .palette-items {
    max-height: 320px;
    overflow-y: auto;
    padding: 8px 0;
  }

  .palette-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: .82rem;
    color: var(--text);
    transition: background .15s;
  }

  .palette-item:hover { background: rgba(0,217,255,.07); }

  .palette-item .pi-icon {
    font-size: .9rem;
    width: 24px;
    text-align: center;
    color: var(--cyan);
  }

  .palette-item .pi-shortcut {
    margin-left: auto;
    color: var(--text-dim);
    font-size: .7rem;
  }

  /* ── Scrollbar global ── */
  ::-webkit-scrollbar       { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <span class="logo">⚛ ResidualChat-Resonant</span>
  <div class="header-right" style="flex-direction:column;align-items:flex-end;gap:4px;">
    <div id="status-bar">
      <span class="status-pill" id="pill-turn">turn 0</span>
      <span class="status-pill" id="pill-frags">frags 0</span>
      <span class="status-pill" id="pill-confirms">✓ 0</span>
      <span class="status-pill" id="pill-rejects">✗ 0</span>
    </div>
    <div class="key-hint">
      <span><kbd>Enter</kbd> send</span>
      <span><kbd>Shift+Enter</kbd> newline</span>
      <span><kbd>Ctrl+K</kbd> commands</span>
      <span><kbd>Esc</kbd> clear input</span>
      <span><kbd>Ctrl+L</kbd> clear chat</span>
      <span><kbd>Ctrl+S</kbd> export</span>
    </div>
  </div>
</header>

<!-- ── Main ── -->
<main>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-title">Sessions</div>
    <div id="sessions-list">
      <div style="color:var(--text-dim);font-size:.7rem;padding:4px 8px;">Loading…</div>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadSessions()">↻ Refresh</button>
      <button class="btn btn-ghost btn-sm" onclick="exportSession('json')">⬇ Export JSON</button>
      <button class="btn btn-ghost btn-sm" onclick="exportSession('csv')">⬇ Export CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportSession('txt')">⬇ Export TXT</button>
    </div>
  </aside>

  <!-- Chat -->
  <div id="chat-area">
    <div id="messages">
      <div class="bubble assistant">
        Welcome to <strong>ResidualChat-Resonant</strong>.<br>
        The field is forming. Start typing to begin.<br><br>
        <em style="color:var(--text-dim);font-size:.78rem;">
          Use <kbd>Ctrl+K</kbd> for the command palette.
        </em>
      </div>
    </div>

    <!-- Input -->
    <div id="input-area">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask the field…"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()">⚡ Send</button>
      </div>
      <div class="action-bar">
        <button class="btn btn-confirm btn-sm" onclick="doConfirm()">✓ Confirm</button>
        <button class="btn btn-reject btn-sm" onclick="doReject()">✗ Reject</button>
        <button class="btn btn-ghost btn-sm" onclick="openPalette()">⌨ Commands</button>
        <button class="btn btn-ghost btn-sm" onclick="clearChat()">⊘ Clear</button>
        <span style="flex:1"></span>
        <span id="char-count" style="color:var(--text-dim);font-size:.7rem;">0 / 2048</span>
      </div>
    </div>
  </div>
</main>

<!-- ── Toast ── -->
<div id="toast"></div>

<!-- ── Command Palette ── -->
<div id="cmd-palette" onclick="closePalette(event)">
  <div class="palette-box">
    <input class="palette-search" id="palette-search"
           placeholder="Search commands…" oninput="filterPalette()" onkeydown="paletteKey(event)" autocomplete="off">
    <div class="palette-items" id="palette-items"></div>
  </div>
</div>

<script>
// ── State ──
let pendingMessageId = null;

// ── API helpers ──
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  return resp.json();
}

// ── Toast ──
let _toastTimer = null;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', 2800);
}

// ── Status refresh ──
async function refreshStatus() {
  try {
    const res = await api('GET', '/api/status');
    if (res.ok) {
      const d = res.data;
      setText('pill-turn',     `turn ${d.turn}`);
      setText('pill-frags',    `frags ${d.fragments}`);
      setText('pill-confirms', `✓ ${d.confirms}`);
      setText('pill-rejects',  `✗ ${d.rejects}`);
      document.getElementById('pill-turn').classList.add('pulse');
      setTimeout(() => document.getElementById('pill-turn').classList.remove('pulse'), 600);
    }
  } catch(e) {}
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

// ── Append bubble ──
function appendBubble(role, content, actions = []) {
  const msgs = document.getElementById('messages');

  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + role;
  wrap.innerHTML = escapeHtml(content).replace(/\n/g, '<br>');

  if (actions.length) {
    const bar = document.createElement('div');
    bar.className = 'bubble-actions';
    actions.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (a.cls || 'btn-ghost');
      btn.textContent = a.label;
      btn.onclick = a.fn;
      bar.appendChild(btn);
    });
    wrap.appendChild(bar);
  }

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
  return wrap;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Typing indicator ──
function showTyping() {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'bubble assistant';
  el.id = 'typing-indicator';
  el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── Send message ──
async function sendMessage() {
  const ta = document.getElementById('user-input');
  const query = ta.value.trim();
  if (!query) return;

  appendBubble('user', query);
  ta.value = '';
  ta.style.height = 'auto';
  updateCharCount();

  showTyping();

  try {
    const res = await api('POST', '/api/chat', { query });
    hideTyping();

    if (res.ok) {
      appendBubble('assistant', res.data.reply, [
        { label: '✓ Confirm', cls: 'btn-confirm', fn: doConfirm },
        { label: '✗ Reject',  cls: 'btn-reject',  fn: doReject },
      ]);
      refreshStatus();
    } else {
      appendBubble('assistant', '⚠ ' + (res.error || 'Error'));
      toast(res.error || 'Error', 'error');
    }
  } catch(e) {
    hideTyping();
    appendBubble('assistant', '⚠ Network error.');
    toast('Network error', 'error');
  }
}

// ── Confirm / Reject ──
async function doConfirm() {
  try {
    const res = await api('POST', '/api/confirm');
    if (res.ok) {
      toast('✓ Confirmed', 'success');
      refreshStatus();
    } else {
      toast(res.error || 'Nothing to confirm', 'error');
    }
  } catch(e) { toast('Network error', 'error'); }
}

async function doReject() {
  try {
    const res = await api('POST', '/api/reject');
    if (res.ok) {
      toast('✗ Rejected', 'error');
      refreshStatus();
    } else {
      toast(res.error || 'Nothing to reject', 'error');
    }
  } catch(e) { toast('Network error', 'error'); }
}

// ── Teach ──
async function doTeach(text) {
  if (!text) text = prompt('Enter text to teach:');
  if (!text) return;
  try {
    const res = await api('POST', '/api/teach', { text });
    if (res.ok) {
      toast('Taught: ' + text.slice(0, 40), 'success');
      refreshStatus();
    } else {
      toast(res.error || 'Teach failed', 'error');
    }
  } catch(e) { toast('Network error', 'error'); }
}

// ── Clear chat (visual only) ──
function clearChat() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div class="bubble assistant">Chat cleared locally. Field state preserved.</div>';
  toast('Chat cleared locally', 'info');
}

// ── Export ──
async function exportSession(fmt) {
  toast(`Exporting ${fmt.toUpperCase()}…`, 'info');
  try {
    const resp = await fetch('/api/export?format=' + fmt, { method: 'POST' });
    if (!resp.ok) {
      const err = await resp.json();
      toast(err.error || 'Export failed', 'error');
      return;
    }
    const blob = await resp.blob();
    const cd = resp.headers.get('Content-Disposition') || '';
    const match = cd.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
    const filename = match ? match[1].replace(/['"]/g, '') : `export.${fmt}`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast(`Downloaded ${filename}`, 'success');
  } catch(e) { toast('Export failed', 'error'); }
}

// ── Sessions ──
async function loadSessions() {
  const list = document.getElementById('sessions-list');
  list.innerHTML = '<div style="color:var(--text-dim);font-size:.7rem;padding:4px 8px;">Loading…</div>';
  try {
    const res = await api('POST', '/api/sessions', { page: 1, per_page: 30 });
    if (!res.ok) { list.innerHTML = '<div style="color:var(--error);font-size:.7rem;padding:4px 8px;">Error</div>'; return; }
    const sessions = res.data.sessions;
    if (!sessions.length) {
      list.innerHTML = '<div style="color:var(--text-dim);font-size:.7rem;padding:4px 8px;">No sessions</div>';
      return;
    }
    list.innerHTML = '';
    sessions.forEach(s => {
      const el = document.createElement('div');
      el.className = 'session-item';
      const meta = s.metadata || {};
      el.title = s.id;
      el.textContent = s.id.slice(0, 8) + '… t=' + (meta.turn || '?');
      el.onclick = () => viewSession(s.id);
      list.appendChild(el);
    });
  } catch(e) {
    list.innerHTML = '<div style="color:var(--error);font-size:.7rem;padding:4px 8px;">Failed</div>';
  }
}

async function viewSession(id) {
  try {
    const res = await api('GET', `/api/sessions/${id}`);
    if (!res.ok) { toast('Session not found', 'error'); return; }
    const msgs = res.data.messages || [];
    const msgDiv = document.getElementById('messages');
    msgDiv.innerHTML = `<div class="bubble assistant" style="color:var(--text-dim);font-size:.78rem;">
      Session: ${id.slice(0,8)}…  (${msgs.length} messages)
    </div>`;
    msgs.forEach(m => {
      appendBubble(m.role === 'user' ? 'user' : 'assistant', m.content);
    });
    toast('Session loaded', 'info');
  } catch(e) { toast('Failed to load session', 'error'); }
}

// ── Character count ──
function updateCharCount() {
  const ta = document.getElementById('user-input');
  const el = document.getElementById('char-count');
  const len = ta.value.length;
  el.textContent = `${len} / 2048`;
  el.style.color = len > 1900 ? 'var(--error)' : 'var(--text-dim)';
}

// ── Auto-resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

// ── Keyboard shortcuts ──
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    document.getElementById('user-input').value = '';
    updateCharCount();
  }
});

document.getElementById('user-input').addEventListener('input', function() {
  autoResize(this);
  updateCharCount();
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'k') { e.preventDefault(); openPalette(); }
  if (mod && e.key === 'l') { e.preventDefault(); clearChat(); }
  if (mod && e.key === 's') { e.preventDefault(); exportSession('json'); }
  if (e.key === 'Escape') { closePalette(null); }
});

// ── Command Palette ──
const PALETTE_COMMANDS = [
  { icon: '⚡', label: 'Send message',       shortcut: 'Enter',   fn: sendMessage },
  { icon: '✓',  label: 'Confirm response',   shortcut: '',         fn: doConfirm  },
  { icon: '✗',  label: 'Reject response',    shortcut: '',         fn: doReject   },
  { icon: '📚', label: 'Teach fragment',      shortcut: '',         fn: () => doTeach('') },
  { icon: '⊘',  label: 'Clear chat (local)', shortcut: 'Ctrl+L',  fn: clearChat  },
  { icon: '⬇',  label: 'Export JSON',        shortcut: 'Ctrl+S',  fn: () => exportSession('json') },
  { icon: '⬇',  label: 'Export CSV',         shortcut: '',         fn: () => exportSession('csv')  },
  { icon: '⬇',  label: 'Export TXT',         shortcut: '',         fn: () => exportSession('txt')  },
  { icon: '↻',  label: 'Refresh sessions',   shortcut: '',         fn: loadSessions },
];

function renderPalette(filter = '') {
  const container = document.getElementById('palette-items');
  const lf = filter.toLowerCase();
  const items = PALETTE_COMMANDS.filter(c => c.label.toLowerCase().includes(lf));
  container.innerHTML = '';
  items.forEach((cmd, i) => {
    const el = document.createElement('div');
    el.className = 'palette-item';
    el.dataset.idx = i;
    el.innerHTML = `<span class="pi-icon">${cmd.icon}</span>
                    <span>${cmd.label}</span>
                    ${cmd.shortcut ? `<span class="pi-shortcut">${cmd.shortcut}</span>` : ''}`;
    el.onclick = () => { closePalette(null); cmd.fn(); };
    container.appendChild(el);
  });
}

function filterPalette() {
  renderPalette(document.getElementById('palette-search').value);
}

function openPalette() {
  renderPalette();
  document.getElementById('cmd-palette').classList.add('open');
  document.getElementById('palette-search').value = '';
  document.getElementById('palette-search').focus();
}

function closePalette(e) {
  if (e && e.target !== document.getElementById('cmd-palette')) return;
  document.getElementById('cmd-palette').classList.remove('open');
}

function paletteKey(e) {
  if (e.key === 'Escape') { closePalette(null); }
  if (e.key === 'Enter') {
    const first = document.querySelector('.palette-item');
    if (first) first.click();
  }
}

// ── Init ──
refreshStatus();
loadSessions();
setInterval(refreshStatus, 10000);
</script>
</body>
